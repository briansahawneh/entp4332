<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence Cow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo-icon" aria-hidden="true">🐮</span>
    <h1>Cadence Cow</h1>
  </div>
  <button id="addContactBtn" class="btn-primary">+ Add Contact</button>
</header>

<nav class="view-tabs">
  <button class="view-tab active" data-view="today">Today</button>
  <button class="view-tab" data-view="contacts">Contacts</button>
</nav>

<main>
  <section id="todayView">
    <p id="todayEmptyState" class="empty-state">Nothing due — the herd's all caught up 🐮</p>
    <ul id="todayList" class="touchpoint-list touchpoint-list-today"></ul>
  </section>

  <section id="contactsView" class="hidden">
    <p id="emptyState" class="empty-state">No contacts yet — round up your first lead to get started 🐮</p>
    <div id="contactGrid" class="card-grid"></div>
  </section>
</main>

<div id="addContactModal" class="modal-overlay hidden">
  <div class="modal">
    <h2>Add Contact</h2>
    <form id="addContactForm">
      <label>Name
        <input type="text" id="fieldName" required>
      </label>
      <label>Job title
        <input type="text" id="fieldJobTitle">
      </label>
      <label>Company
        <input type="text" id="fieldCompany" required>
      </label>
      <label>Email
        <input type="email" id="fieldEmail">
      </label>
      <label>Phone
        <input type="tel" id="fieldPhone">
      </label>
      <label>LinkedIn
        <input type="url" id="fieldLinkedIn" placeholder="https://linkedin.com/in/...">
      </label>
      <label>Cadence start date
        <input type="date" id="fieldStartDate" required>
      </label>
      <label>Notes
        <textarea id="fieldNotes" rows="3"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" id="cancelAddBtn" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>

<div id="contactDetailModal" class="modal-overlay hidden">
  <div class="modal modal-wide">
    <div class="detail-header">
      <h2 id="detailName"></h2>
      <p id="detailCompany" class="card-company"></p>
    </div>

    <ul id="touchpointList" class="touchpoint-list"></ul>
    <p id="touchpointEmptyState" class="empty-state-small">No touchpoints yet — add the first one below.</p>

    <form id="addTouchpointForm" class="touchpoint-form">
      <label>Day offset
        <input type="number" id="tpDayOffset" min="0" required>
      </label>
      <label>Channel
        <select id="tpChannel">
          <option value="email">Email</option>
          <option value="call">Call</option>
          <option value="linkedin">LinkedIn</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label id="tpChannelOtherLabel" class="hidden touchpoint-form-full">Other channel
        <input type="text" id="tpChannelOther" placeholder="e.g. text message">
      </label>
      <label>Description
        <input type="text" id="tpDescription" placeholder="e.g. Intro email referencing their Series B" required>
      </label>
      <div class="touchpoint-form-full touchpoint-form-actions">
        <button type="submit" id="tpSubmitBtn" class="btn-primary">+ Add Touchpoint</button>
        <button type="button" id="tpCancelEditBtn" class="btn-secondary hidden">Cancel edit</button>
      </div>
    </form>

    <div class="modal-actions">
      <button type="button" id="closeDetailBtn" class="btn-secondary">Close</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
