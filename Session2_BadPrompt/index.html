<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Splitter</title>
<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg-top: #0f2027;
    --bg-mid: #203a43;
    --bg-bot: #2c5364;
    --card-bg: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.14);
    --accent: #34d399;
    --accent-dark: #10b981;
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
    --danger: #f87171;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg-top), var(--bg-mid) 50%, var(--bg-bot));
    background-attachment: fixed;
    color: var(--text-main);
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 24px;
    padding: 32px 30px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header .icon {
    font-size: 34px;
    display: block;
    margin-bottom: 6px;
  }

  .header h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header p {
    margin: 6px 0 0;
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .field {
    margin-bottom: 22px;
  }

  .field label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .amount-input {
    position: relative;
  }

  .amount-input span {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    font-weight: 600;
    color: var(--text-dim);
  }

  .amount-input input {
    width: 100%;
    padding: 14px 16px 14px 34px;
    font-size: 22px;
    font-weight: 600;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(0, 0, 0, 0.22);
    color: var(--text-main);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .amount-input input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.25);
  }

  .amount-input input::-webkit-outer-spin-button,
  .amount-input input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .tip-value {
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    text-transform: none;
    letter-spacing: 0;
  }

  .tip-presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .tip-presets button {
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: rgba(0, 0, 0, 0.22);
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }

  .tip-presets button:hover {
    border-color: var(--accent);
  }

  .tip-presets button:active {
    transform: scale(0.96);
  }

  .tip-presets button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #06281f;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.15);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 6px;
  }

  .stepper button {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    line-height: 1;
  }

  .stepper button:hover {
    background: var(--accent);
    color: #06281f;
  }

  .stepper button:active {
    transform: scale(0.94);
  }

  .stepper .people-count {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stepper .people-count .emoji {
    font-size: 18px;
  }

  .results {
    margin-top: 26px;
    background: linear-gradient(160deg, rgba(52, 211, 153, 0.14), rgba(16, 185, 129, 0.06));
    border: 1px solid rgba(52, 211, 153, 0.35);
    border-radius: 18px;
    padding: 22px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
  }

  .result-row .label {
    font-size: 13.5px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .result-row .value {
    font-size: 16px;
    font-weight: 700;
  }

  .result-row.total {
    border-top: 1px dashed rgba(255, 255, 255, 0.18);
    margin-top: 6px;
    padding-top: 16px;
  }

  .per-person {
    text-align: center;
    margin-top: 8px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }

  .per-person .label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
  }

  .per-person .value {
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
    margin-top: 4px;
  }

  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .reset-btn:hover {
    background: rgba(248, 113, 113, 0.12);
    border-color: var(--danger);
    color: var(--danger);
  }

  @media (max-width: 480px) {
    .card {
      padding: 26px 20px 22px;
    }
    .per-person .value {
      font-size: 36px;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="icon">🧾</span>
    <h1>Tip Splitter</h1>
    <p>Split the bill fairly, down to the penny.</p>
  </div>

  <div class="field">
    <label for="bill">Bill Amount</label>
    <div class="amount-input">
      <span>$</span>
      <input type="number" id="bill" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
    </div>
  </div>

  <div class="field">
    <label>Tip Percentage <span class="tip-value" id="tipValueLabel">15%</span></label>
    <div class="tip-presets" id="tipPresets">
      <button data-tip="10">10%</button>
      <button data-tip="15" class="active">15%</button>
      <button data-tip="18">18%</button>
      <button data-tip="20">20%</button>
    </div>
    <input type="range" id="tipSlider" min="0" max="50" step="1" value="15">
  </div>

  <div class="field">
    <label for="people">Split Between</label>
    <div class="stepper">
      <button type="button" id="minusPeople" aria-label="Decrease people">−</button>
      <div class="people-count"><span class="emoji">👥</span><span id="peopleCount">1</span></div>
      <button type="button" id="plusPeople" aria-label="Increase people">+</button>
    </div>
  </div>

  <div class="results">
    <div class="result-row">
      <span class="label">Tip Amount</span>
      <span class="value" id="tipAmount">$0.00</span>
    </div>
    <div class="result-row total">
      <span class="label">Total (Bill + Tip)</span>
      <span class="value" id="totalAmount">$0.00</span>
    </div>
    <div class="per-person">
      <div class="label">Each Person Pays</div>
      <div class="value" id="perPerson">$0.00</div>
    </div>
  </div>

  <button type="button" class="reset-btn" id="resetBtn">Reset</button>
</div>

<script>
  const billInput = document.getElementById('bill');
  const tipSlider = document.getElementById('tipSlider');
  const tipValueLabel = document.getElementById('tipValueLabel');
  const tipPresets = document.getElementById('tipPresets');
  const peopleCountEl = document.getElementById('peopleCount');
  const minusBtn = document.getElementById('minusPeople');
  const plusBtn = document.getElementById('plusPeople');
  const tipAmountEl = document.getElementById('tipAmount');
  const totalAmountEl = document.getElementById('totalAmount');
  const perPersonEl = document.getElementById('perPerson');
  const resetBtn = document.getElementById('resetBtn');

  let people = 1;

  function formatCurrency(n) {
    if (!isFinite(n)) n = 0;
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function setActivePreset(tipVal) {
    const buttons = tipPresets.querySelectorAll('button');
    let matched = false;
    buttons.forEach(btn => {
      if (parseInt(btn.dataset.tip, 10) === tipVal) {
        btn.classList.add('active');
        matched = true;
      } else {
        btn.classList.remove('active');
      }
    });
    return matched;
  }

  function calculate() {
    const bill = parseFloat(billInput.value) || 0;
    const tipPercent = parseFloat(tipSlider.value) || 0;

    const tipAmount = bill * (tipPercent / 100);
    const total = bill + tipAmount;
    const perPerson = total / people;

    tipAmountEl.textContent = formatCurrency(tipAmount);
    totalAmountEl.textContent = formatCurrency(total);
    perPersonEl.textContent = formatCurrency(perPerson);
  }

  function updateTipDisplay() {
    const tipVal = parseInt(tipSlider.value, 10);
    tipValueLabel.textContent = tipVal + '%';
    setActivePreset(tipVal);
    calculate();
  }

  billInput.addEventListener('input', calculate);

  tipSlider.addEventListener('input', updateTipDisplay);

  tipPresets.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const tipVal = parseInt(btn.dataset.tip, 10);
    tipSlider.value = tipVal;
    updateTipDisplay();
  });

  minusBtn.addEventListener('click', () => {
    if (people > 1) {
      people -= 1;
      peopleCountEl.textContent = people;
      calculate();
    }
  });

  plusBtn.addEventListener('click', () => {
    people += 1;
    peopleCountEl.textContent = people;
    calculate();
  });

  resetBtn.addEventListener('click', () => {
    billInput.value = '';
    tipSlider.value = 15;
    people = 1;
    peopleCountEl.textContent = people;
    updateTipDisplay();
    billInput.focus();
  });

  updateTipDisplay();
</script>

</body>
</html>
